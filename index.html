<!DOCTYPE html>
<!-- This is the Home page. -->
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Hero</title>
    <link rel="stylesheet" href="./assets/styles.css">
  </head>
  <body>
    <!-- Navbar Section -->
    <div class="navbar">
      <a href="index.html" class="current">Home</a>
      <!-- The current class gives special styling to indicate this is the current page. -->
      <a href="pages/about-me.html">About Us</a>
      <a href="pages/resource-page.html">Resource Page</a>
      <a href="pages/tech-hero.html">Tech Hero</a>
    </div>
    <!-- This is a navbar, which enables users to switch to different pages. The navbar class controls the styling. For example, each navbar link appears side-by-side. The class also makes the navbar sticky, so that it stays with the user as they scroll. It makes the navbar have a higher z-index than other items, so it will appear above them. It also gives the navbar a green background. -->

    <div class="content">
    <!-- This content class creates the white page backdrop and padding to differentiate text from the light green background. -->
      <div class="col">
      <!-- This col class uses the Flexible Box Layout Module. It makes centering children horizontally in a manner that is responsive to different screen sizes easier. The column flex-direction ensures that the children are listed vertically rather than horizontally. -->
        <h1>Welcome!</h1>
        <p class="text-center">
        <!-- The text-center class makes text center-aligned. -->
          Explore to learn more about your fellow LIS500 students, the inspirational Catt Small, and implicit bias.
        </p>
        <!-- GIF(s) to welcome people -->
        <img src="assets/heart.gif" alt="GIF of two people forming a heart." class="big-image">
        <!-- The class big-image ensures the size of the image is proportional to the width of the screen. This makes the image responsive to different screen sizes. This size is considered "big" because the image's width will be over half the width of the screen. -->
      </div>
    </div>
  </body>
</html>
